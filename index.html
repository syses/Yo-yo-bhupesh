<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Run Away, Agents!</title>
<style>
body{
    margin:0;
    background:#222;
    overflow:hidden;
}
canvas{
    display:block;
    margin:auto;
    background:#eee;
}
</style>
</head>
<body>

<canvas id="game" width="900" height="600"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const player={
    x:450,
    y:300,
    size:20,
    speed:5
};

const keys={};

document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>keys[e.key]=false);

let agents=[];

for(let i=0;i<10;i++){
    agents.push({
        x:Math.random()*900,
        y:Math.random()*600,
        size:18
    });
}

function update(){

    if(keys["ArrowUp"]) player.y-=player.speed;
    if(keys["ArrowDown"]) player.y+=player.speed;
    if(keys["ArrowLeft"]) player.x-=player.speed;
    if(keys["ArrowRight"]) player.x+=player.speed;

    player.x=Math.max(0,Math.min(canvas.width-player.size,player.x));
    player.y=Math.max(0,Math.min(canvas.height-player.size,player.y));

    agents.forEach(a=>{

        let dx=a.x-player.x;
        let dy=a.y-player.y;
        let dist=Math.sqrt(dx*dx+dy*dy);

        if(dist<250){
            a.x+=dx/dist*3;
            a.y+=dy/dist*3;
        }

        a.x=Math.max(0,Math.min(canvas.width-a.size,a.x));
        a.y=Math.max(0,Math.min(canvas.height-a.size,a.y));
    });
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="blue";
    ctx.fillRect(player.x,player.y,player.size,player.size);

    ctx.fillStyle="red";
    agents.forEach(a=>{
        ctx.fillRect(a.x,a.y,a.size,a.size);
    });

    ctx.fillStyle="black";
    ctx.font="20px Arial";
    ctx.fillText("You: Blue | CID Agents: Red (they run away!)",20,30);
}

function gameLoop(){
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
